<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挖洞猜角色-遊戲說明</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 50px;
            font-size: 26px;

        }
        h1 {
            color: #333;
        }
        p {
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
            color: #555;
        }
        .button-container {
            margin-top: 30px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #1E88E5;
        }
    </style>
</head>
<body>
    <h1>挖洞猜角色-遊戲說明</h1>
    <h2>遊戲規則：</h2>
    <p>
        每組輪流挖洞，只能猜一次作品名與角色名，猜錯就輪到下一組開始挖洞。<br>
        猜對作品名+1分、猜對角色名+2分。<br><br>
        每題起始挖洞的組別皆會輪流。<br>
    </p>
    <p>題目所出場的角色包括但不限於：動畫、漫畫、遊戲、迷因、音樂MV。</p>
    
    <div class="button-container">
        <button onclick="navigate('/CharacterGuessingGame')">開始遊戲</button>
    </div>

    <script>
         function navigate(href) {
            window.location.href = href;
        }
    </script>
</body>
</html>
